# ZrO₂/Al₂O₃/ZrO₂ 叠层结构对照 —— t₂ = 0 nm（单层退化点）
#
# t₂ 系列（ADR-006/019）：固定总厚 8 nm，ZrO₂ 两侧对称分配 t₁=t₃=(8−t₂)/2，
# t₂ ∈ {0, 2, 4} nm 各一份配置，各跑一次 `sweep` 命令、比对三份 CSV。
# 三份只有层结构不同，材料、缺陷、器件、扫描范围、系综全部相同。
#
# **本份是 t₂=0**：没有 Al₂O₃、没有 ZrO₂/Al₂O₃ 界面，界面缺陷同时关闭，
# 回到纯单层 8 nm ZrO₂——既是 t₂ 标度的起点，也兼作单层回归校验
# （io 拒绝 0 厚层，所以这里写成只含一个 layer，而不是 thickness_nm: 0）。
# 器件与缺陷参数与 examples/single_run.yaml 完全一致。
#
# 层厚必须是 hz = Lz/nz = 8/80 = 0.1 nm 的整数倍（变 κ 泊松要求界面落在
# 网格节点上，ADR-011）：4/0/4、3/2/3、2/4/2 三组都对齐。

materials:
  ZrO2:
    kappa: 38.0          # 静态介电常数，只用于泊松方程
    eps_opt: 5.6         # 光学介电常数，只用于 PF 发射 (R8)
    band_gap_eV: 5.4
    electron_affinity_eV: 2.86   # 与 Φ_m=4.6 一起给出 E_B=1.74 eV
    m_cb_me: 1.2         # 导带边有效质量（裸带边质量）
    m_vb_me: 2.5
    m_di_me: 1.2         # 隧穿有效质量，速率公式实际使用；现设为 = m_cb
    phonon_energy_eV: 0.04
    huang_rhys_S: 1.0
    attempt_frequency_s: 1.0e13  # ν0，R6/R7/R8 共用

layers:
  # t₂=0：只有一层 ZrO₂，Lz = 8 nm，没有内部界面，也就没有 interfaces 段
  - material: ZrO2
    thickness_nm: 8.0
    defects:
      concentration_cm3: 3.0e18
      charge_state_Z: 1.0          # 施主型，未占据时 +1，不可双占据
      min_separation_nm: 0.5       # 缺陷两两之间 + 缺陷到电极/内部界面的最小距离
      level:
        mode: gaussian
        ED_eV: 1.15
        sigma_eV: 0.15
      spatial:
        # 界面富集轮廓按**所在层**的起止边界算（分层生成，ADR-005）：
        # t₂>0 的两份里两层 ZrO₂ 各自在自己的两端富集
        mode: interface
        enrichment: 5.0
        decay_length_nm: 1.0

device:
  Lx_nm: 50.0
  Ly_nm: 50.0
  barrier_height_eV: 1.74   # 接触势垒直接指定，三份配置一致

electrodes:
  negative: &electrode
    name: TiN
    work_function_eV: 4.6
    effective_mass_me: 1.0
    fermi_energy_eV: 5.0
  positive: *electrode

simulation:
  voltage_V: 3.0          # 被 sweep 覆盖，仅作占位
  temperature_C: 25.0     # 同上
  n_events: 4000
  burn_in_fraction: 0.2
  seed: 12345             # 有 ensemble 段时被随机抽取的种子逐个覆盖
  grid:
    # hz = 8/80 = 0.1 nm，层厚必须是它的整数倍；hx = hy = 1.5625 nm
    nx: 32
    ny: 32
    nz: 80

sweep:
  voltage_V:
    start: 2.0
    stop: 4.0
    step: 0.5
  temperature_C:
    start: 25.0
    stop: 125.0
    step: 50.0

ensemble:
  count: 5
