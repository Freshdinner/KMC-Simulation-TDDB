# TDDB 仿真配置：ZrO₂ 单层 MIM（规格见 PROJECT_CONTEXT_TDDB.md）
#
# 材料与缺陷沿用漏电流侧的参考预设（docs/physics_model.md），与
# examples/single_run.yaml 逐项相同（材料名与 min_separation_nm 之外）。t=0 的初始缺陷集合由现有
# generate_defects 按下面的 defects 段生成；应力生成的 O 空位与初始缺陷是同一物种，
# 共用这一段（能级分布、S、m_di、施主型 charge_state_Z），不另设物种参数（第 1 节、6.7）。
#
# 盒子与默认盒子（single_run.yaml）相同：50×50×8 nm、3×10^18 cm^-3 → 60 个初始缺陷（6.3、ADR-051）；
# 差别只在横向网格步长与系综个数。
#
# 初始缺陷集合下的稳态本底用 run / sweep / plot；TDDB 瞬态轨迹用
# python -m kmc_leakage tddb --config examples/zro2_tddb.yaml --seed 1 --out it.csv --plot it.png

materials:
  ZrO2:
    kappa: 38.0          # 静态介电常数：泊松方程，也是生成率 G 场加速项里的 k（8.1）
    eps_opt: 5.6         # 光学介电常数，只用于 PF 发射 (R8)
    band_gap_eV: 5.4
    electron_affinity_eV: 2.86   # 与 Φ_m=4.6 一起给出 E_B=1.74 eV
    m_cb_me: 1.2         # 导带边有效质量（裸带边质量）
    m_vb_me: 2.5         # 价带边有效质量（裸带边质量）
    m_di_me: 1.2         # 隧穿有效质量，速率公式实际使用；现设为 = m_cb
    phonon_energy_eV: 0.04       # ℏω₀
    huang_rhys_S: 1.0            # O 空位的 Huang-Rhys 因子 S，进输运 R4/R5 的声子权重
    attempt_frequency_s: 1.0e13  # ν0，R6/R7/R8 共用

layers:
  - material: ZrO2
    thickness_nm: 8.0
    defects:
      # 初始缺陷与生成的 O 空位共用这一段。生成的空位出生时被一个电子占据，带着与它重合的 O_i⁻
      # （q_fix = −e），连同 O_i⁻ 出生时带 −e，电子发射后合起来为中性（6.7、ADR-048）；出生占据与 O_i⁻
      # 由瞬态驱动给出，不属于这段缺陷配置
      concentration_cm3: 3.0e18    # 只管 t=0 的初始缺陷个数
      charge_state_Z: 1.0          # 施主型：电子离开后（未占据）+1，占据一个电子时中性，不可双占据
      # 缺陷两两之间 + 缺陷到电极界面的最小距离，取 ZrO₂ 的 O–O 间距；前驱位点也按它做最大随机堆积（ADR-055）
      min_separation_nm: 0.26
      level:
        mode: gaussian
        ED_eV: 1.15
        sigma_eV: 0.15
      spatial:
        mode: interface
        enrichment: 5.0
        decay_length_nm: 1.0

device:
  Lx_nm: 50.0
  Ly_nm: 50.0
  barrier_height_eV: 1.74

electrodes:
  negative: &electrode
    name: TiN
    work_function_eV: 4.6
    effective_mass_me: 1.0
    fermi_energy_eV: 5.0
  positive: *electrode

simulation:
  # 应力电压与温度待实验数据确定（第 1 节"待确认"），先取 3.6 V / 25 °C
  voltage_V: 3.6
  temperature_C: 25.0
  n_events: 20000
  burn_in_fraction: 0.2
  seed: 12345        # 只在没有 ensemble 段时生效，否则由 ensemble 随机抽取的种子逐个覆盖
  grid:
    # 横向 hx = hy = 0.25 nm、hz = 0.1 nm（ADR-032）：0.5–0.9 nm 间距空位对的库仑能与
    # hx = 0.2 nm 相差 ≤ 4%；原先跟默认盒子的 1.54 nm 步长只给出收敛值的 40–60%（6.5）
    nx: 200
    ny: 200
    nz: 80

# 初始缺陷集合下的稳态本底，覆盖应力电压附近与高温两档。Phase 0 与默认盒子的对比
# 就在这 6 个工作点上做（ADR-026）
sweep:
  voltage_V:
    start: 2.0
    stop: 4.0
    step: 1.0
  temperature_C:
    start: 25.0
    stop: 125.0
    step: 100.0

# M = 30 原按 20×20 nm 小盒子的散布定（σ(log₁₀J) ≈ 0.9–1.4，ADR-026）；盒子改为 50×50 nm 后
# 3.6 V 下 σ(log₁₀J) = 0.35（ADR-050），M = 30 保留给 I-t 系综平均与 t_BD 的 Weibull 拟合（ADR-051）
ensemble:
  count: 30

# TDDB 缺陷生成、热反馈与击穿判据参数（第 3 节参数表，ADR-024/035/036）。由 io.py 读入并换算到 SI。
tddb:
  # E_A：无场下形成 Frenkel 对的激活能，全部前驱位点取同一个值（式 T2；双电子机制下即 E_A,2e；ADR-053）。p₀ = 1 eÅ 时
  # 3.6 V / 8 nm 下场加速项压低 0.6 eV，有效势垒 0.70 eV。1.30 eV 是初值，标定待定：前驱位点按 0.26 nm 铺满、r_c = 0.3 nm 时
  # seed 1–3 跑到约 6 s（420 个空位）都没有击穿（ADR-055 验收）；P_bb 未饱和时 E_A 只改时间标尺。
  # 有效势垒对电压的斜率只由 p₀ 定，与 E_A 无关
  activation_energy_eV: 1.30
  # 前驱单步俘获参数（式 T4/T9/T10）
  precursor_ionization_energy_eV: 1.15   # E_t1，取与 O 空位预设相同的值（= defects.level.ED_eV，ADR-028）
  # E_rel1：第一次电子俘获导致 O-Zr-O 键断裂、O 空位形成的弛豫能（论文 SiO₂ 里对应 Si-O 键，
  # 1.5 eV）。只进生成率：E_rel1/ℏω₀ 作为 R_1e 多声子线型的参数，与输运用的 huang_rhys_S 无关。
  # 暂取 1.0 eV（ADR-030）
  precursor_relaxation_energy_eV: 1.0
  dipole_moment_eA: 1.0   # p₀：前驱有效偶极矩均值 [e·Å]（式 T2/T3，ADR-035）
  # P_bb 用宏观场：泊松解的场在 Gaussian 窗口（标准差 σ，半高全宽 2.355σ ≈ 1.2 nm，约两个 ZrO₂ 晶格常数）
  # 上取空间平均，去掉带电空位亚纳米近旁的点电荷场，保留空位层与团簇尖端的 ≳1 nm 场结构（ADR-043）。0 = 局域场
  field_averaging_width_nm: 0.5
  # 前驱位点不设浓度（6.1，ADR-055）：t = 0 在 z ∈ [0.26, 7.74] nm 的可采样窗口里按上面的 min_separation_nm
  # 做最大随机堆积，直到再也放不下一个位点（约 4.3×10²² cm⁻³，50×50 nm 盒子约 80 万个），每个位点断键一次就用掉
  # r_c：导电通路的连通距离（6.3，ADR-054/055）。O 空位间距 < r_c 连成导电簇，离电极平面 < r_c 的空位接到该电极，
  # 接电极的导电簇与该电极等电位，悬空导电簇自身等电位（ADR-056）；负极侧与正极侧导电簇连通（贯穿通路）即击穿，这一刻就是 t_BD，电流加上
  # 细丝的 G₀·V（3.6 V 下 0.28 mA）。0.3 nm 略大于 O–O 间距，只有紧挨着的空位才连通
  percolation_distance_nm: 0.3
  # k_TH：ZrO₂ 热导率（式 T14，ADR-040）。删掉这一项即等温运行
  thermal_conductivity_W_mK: 2.0
  # 未击穿时按生成空位数或应力时间上限停止（机时上限）
  max_generated_vacancies: 3000
  stop_time_s: 1.0e4
  # 恒压应力取 simulation 段的 voltage_V、环境温度取 temperature_C（ADR-033），实验数据到手后改那里
